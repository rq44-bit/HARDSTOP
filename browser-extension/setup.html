<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Enable Browser Protection | HardStop</title>
    <link rel="stylesheet" href="src/hardstop-theme.css">
    <link rel="stylesheet" href="src/setup.css">
  </head>
  <body>
    <main class="setup-shell">
      <header class="hs-brand setup-brand">
        <img class="hs-brand__logo setup-logo" src="assets/hardstop-logo-96.png" alt="">
        <div>
          <p class="hs-brand__name">HARDSTOP</p>
          <p class="hs-brand__slogan">Block the Bet. Build Your Future.</p>
        </div>
      </header>

      <section class="setup-content" aria-labelledby="setup-title">
        <div id="setup-status" class="hs-status" data-state="starting" role="status" aria-live="polite">
          <span class="hs-status__dot" aria-hidden="true"></span>
          <span id="setup-status-label">Ready to connect</span>
        </div>
        <h1 id="setup-title">Enable Browser Protection</h1>
        <p id="setup-description">HardStop will block known gambling websites while protection is active.</p>
        <button id="enable-protection" class="hs-button" type="button">Enable Protection</button>
        <p id="setup-note" class="setup-note">HardStop will confirm the secure desktop connection before setup completes.</p>
      </section>
    </main>
    <script src="src/setup.js"></script>
  </body>
</html>
